<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El Impostor — Versión Fútbol</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --accent:#eab308; --muted:#9aa4b2; --glass: rgba(255,255,255,0.03);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    body{
      margin:0; background: linear-gradient(180deg,#071021 0%, #071827 60%); color:#e6eef6;
      display:flex; align-items:flex-start; justify-content:center; min-height:100vh; padding:32px;
    }
    .container{ width:100%; max-width:900px; }
    header{ margin-bottom:20px; }
    h1{ margin:0; font-size:1.6rem; color:var(--accent); }
    p.lead{ margin:0; color:var(--muted); }

    .card{ background:var(--card); border-radius:12px; padding:20px; box-shadow: 0 6px 18px rgba(2,6,23,0.6); margin-bottom:20px; }
    label{ display:block; font-size:0.9rem; margin-bottom:6px; color:var(--muted); }
    input, select{ width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:var(--glass); color:inherit; }
    .row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .btn{ background:var(--accent); color:#071021; padding:10px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:700; }
    .btn.ghost{ background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.03); }
    .notice{ padding:10px; border-radius:8px; background:rgba(234,179,8,0.12); color:var(--accent); margin-bottom:10px; }
    .small{ font-size:0.85rem; color:var(--muted); }
    .center{ text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>El Impostor — Versión Fútbol</h1>
      <p class="lead">¿Podrán descubrir quien es el impostor?</p>
    </header>

    <!-- Configuración inicial -->
    <div class="card" id="setupCard">
      <div class="notice"><strong>Reglas:</strong> mínimo 3 jugadores. Para 2 impostores, mínimo 5 jugadores.</div>
      <label for="numPlayers">Número de jugadores</label>
      <input id="numPlayers" type="number" min="3" value="3" />

      <div style="margin-top:10px;">
        <label>Impostores</label>
        <div class="row">
          <label><input id="oneImpostor" type="radio" name="impostores" checked /> 1 impostor</label>
          <label><input id="twoImpostors" type="radio" name="impostores" /> 2 impostores</label>
        </div>
        <div class="small">Recuerda: con 2 impostores se necesitan al menos 5 jugadores.</div>
      </div>

      <div style="margin-top:14px;" class="row">
        <button id="continueBtn" class="btn">Continuar</button>
      </div>
    </div>

    <!-- Ingreso de nombres -->
    <div class="card" id="nameCard" style="display:none;">
      <h3>Ingresa los nombres de los jugadores</h3>
      <div id="nameFields"></div>
      <button id="startGameBtn" class="btn">Comenzar partida</button>
    </div>

    <!-- Pantalla de juego -->
    <div class="card center" id="gameCard" style="display:none;">
      <h2 id="playerTitle"></h2>
      <h3 id="assignmentText" style="margin:20px 0; font-size:1.3rem;"></h3>
      <button id="nextBtn" class="btn">Siguiente jugador</button>
    </div>

    <!-- Final -->
    <div class="card center" id="endCard" style="display:none;">
      <h2>¡Todos listos! ⚽</h2>
      <p>Que comience el juego 🔥</p>
      <button class="btn" id="restartBtn">Volver a jugar</button>
    </div>
  </div>

  <script>
    const PLAYERS_DB = [
      "Lionel Messi","Pelé","Diego Maradona","Cristiano Ronaldo","Johan Cruyff","Zinedine Zidane","Ronaldo Nazário","Franz Beckenbauer","Michel Platini","Alfredo Di Stéfano",
      "Ferenc Puskás","Garrincha","Ronaldinho","Eusebio","Paolo Maldini","Roberto Baggio","Bobby Charlton","Lev Yashin","Gerd Müller","Stanley Matthews",
      "Lothar Matthäus","Marco van Basten","Xavi Hernández","Andrés Iniesta","Thierry Henry","Kylian Mbappé","Neymar Jr","Luis Suárez","Sergio Ramos","Iker Casillas",
      "Paolo Rossi","George Best","Romário","Rivaldo","Ruud Gullit","Jürgen Klinsmann","Dennis Bergkamp","Clarence Seedorf","Zlatan Ibrahimović","Roberto Carlos",
      "Hugo Sánchez","Diego Forlán","Gianluigi Buffon","Andrea Pirlo","Luka Modrić","Eric Cantona","Didier Drogba","David Beckham","Samuel Eto'o","Wayne Rooney"
    ];

    const setupCard = document.getElementById('setupCard');
    const nameCard = document.getElementById('nameCard');
    const gameCard = document.getElementById('gameCard');
    const endCard = document.getElementById('endCard');

    const numPlayersInput = document.getElementById('numPlayers');
    const oneImpostor = document.getElementById('oneImpostor');
    const twoImpostors = document.getElementById('twoImpostors');
    const nameFields = document.getElementById('nameFields');
    const continueBtn = document.getElementById('continueBtn');
    const startGameBtn = document.getElementById('startGameBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playerTitle = document.getElementById('playerTitle');
    const assignmentText = document.getElementById('assignmentText');
    const restartBtn = document.getElementById('restartBtn');

    let numPlayers = 0;
    let impostorCount = 1;
    let playerNames = [];
    let assignments = [];
    let currentPlayer = 0;

    continueBtn.onclick = () => {
      numPlayers = parseInt(numPlayersInput.value);
      if (numPlayers < 3) {
        alert("Debe haber al menos 3 jugadores.");
        return;
      }
      impostorCount = twoImpostors.checked ? 2 : 1;
      if (impostorCount === 2 && numPlayers < 5) {
        alert("Para 2 impostores se necesitan al menos 5 jugadores.");
        return;
      }
      setupCard.style.display = "none";
      nameCard.style.display = "block";
      nameFields.innerHTML = "";
      for (let i = 0; i < numPlayers; i++) {
        nameFields.innerHTML += `<input id="name${i}" placeholder="Jugador ${i + 1}" type="text" style="margin-bottom:8px;">`;
      }
    };

    startGameBtn.onclick = () => {
      playerNames = [];
      for (let i = 0; i < numPlayers; i++) {
        const name = document.getElementById(`name${i}`).value.trim();
        if (!name) {
          alert("Todos los nombres deben completarse.");
          return;
        }
        playerNames.push(name);
      }

      // Elegir un solo futbolista para todos
      const chosenPlayer = PLAYERS_DB[Math.floor(Math.random() * PLAYERS_DB.length)];

      // Seleccionar impostores al azar
      let impostorIndexes = [];
      while (impostorIndexes.length < impostorCount) {
        let rand = Math.floor(Math.random() * numPlayers);
        if (!impostorIndexes.includes(rand)) impostorIndexes.push(rand);
      }

      // Asignaciones: todos el mismo jugador excepto impostores
      assignments = playerNames.map((_, i) =>
        impostorIndexes.includes(i) ? "IMPOSTOR" : chosenPlayer
      );

      currentPlayer = 0;
      nameCard.style.display = "none";
      gameCard.style.display = "block";
      showCard();
    };

    function showCard() {
      playerTitle.textContent = playerNames[currentPlayer];
      assignmentText.textContent = "Presiona para ver tu rol";
      nextBtn.textContent = "Ver";
      let revealed = false;

      nextBtn.onclick = () => {
        if (!revealed) {
          assignmentText.textContent = assignments[currentPlayer];
          nextBtn.textContent = currentPlayer === numPlayers - 1 ? "Finalizar" : "Siguiente jugador";
          revealed = true;
        } else {
          currentPlayer++;
          if (currentPlayer < numPlayers) {
            showCard();
          } else {
            gameCard.style.display = "none";
            endCard.style.display = "block";
          }
        }
      };
    }

    restartBtn.onclick = () => {
      endCard.style.display = "none";
      setupCard.style.display = "block";
      numPlayersInput.value = 3;
      oneImpostor.checked = true;
      twoImpostors.checked = false;
    };
  </script>
</body>
</html>
